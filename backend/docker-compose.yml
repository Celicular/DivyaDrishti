services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddrishti-backend
    restart: unless-stopped
    ports:
      - "${PORT:-1379}:1379"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-1379}
      - SECRET_KEY=${SECRET_KEY:-ddrishti_jwt_super_secret_key_hackathon_2026_cc6}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DB_NAME=${DB_NAME:-ddrishti.db}
      - DB_DIR=${DB_DIR:-/app/data}
      - STORAGE_DIR=${STORAGE_DIR:-/app/storage}
      - GEMMA_INTERNAL_URL=http://gemma-api:13795

    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage/buckets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen('http://localhost:' + os.getenv('PORT', '1379') + '/health')"]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ddrishti-llama-server
    restart: unless-stopped
    expose:
      - "9100"
    volumes:
      - gemma_models:/models
    command:
      - -m
      - /models/gemma-4-e4b/model.gguf
      - --mmproj
      - /models/gemma-4-e4b/mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "9100"
      - --no-mmproj-offload
      - -c
      - "8192"
      - -np
      - "4"
      - --cont-batching
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gemma-api:
    build:
      context: ./gemma
      dockerfile: Dockerfile
    container_name: ddrishti-gemma-api
    restart: unless-stopped
    ports:
      - "13795:13795"
    env_file:
      - path: .env
        required: false
    environment:
      - LLAMA_URL=http://llama:9100
      - MODEL_NAME=${GEMMA_MODEL_NAME:-gemma-4-e4b}
      - REQUEST_TIMEOUT=${GEMMA_REQUEST_TIMEOUT:-300}
      - MAX_TOKENS=${GEMMA_MAX_TOKENS:-2048}
      - TEMPERATURE=${GEMMA_TEMPERATURE:-0.7}
      - GEMMA_API_KEY_SECRET=${GEMMA_API_KEY_SECRET:-ddrishti_gemma_secret_hackathon_2026_cc6}
      - GEMMA_API_KEY=${GEMMA_API_KEY:-}
      - PORT=13795
      - MAX_PARALLEL_INFERENCES=4
      - QUEUE_TIMEOUT=120
    depends_on:
      - llama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:13795/health')"]

      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
  backend_storage:
  gemma_models:
